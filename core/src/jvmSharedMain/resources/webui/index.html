<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>servd</title>
<style>
  :root {
    --bg: #0D1316; --surface: #141D21; --surface-2: #1A252A; --border: #263136;
    --ink: #E6EDEF; --muted: #90A3AA; --faint: #647A81;
    --accent: #22C3A6; --accent-ink: #7BEBD8; --accent-soft: #113029;
    --idle: #5D7178; --warn: #DFA24E;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14px; display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 600; font-size: 17px; }
  .brand .prompt { color: var(--accent); }
  .conn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .spacer { flex: 1; }
  .namebox { display: flex; align-items: center; gap: 8px; }
  .namebox label { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .namebox input {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
    font-family: var(--mono); font-size: 13px; border-radius: 8px; padding: 6px 10px; width: 150px;
  }
  .namebox input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  main { flex: 1; display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .panel-title { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .count { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: 20px; padding: 1px 8px; }
  .roster { overflow-y: auto; }
  .peer { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .ava { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #04150F; }
  .pmeta { min-width: 0; flex: 1; }
  .pname { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paddr { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .tag-you { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .empty { padding: 18px 16px; font-family: var(--mono); font-size: 12px; color: var(--faint); line-height: 1.5; }

  section.chat { display: flex; flex-direction: column; min-height: 0; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; flex-direction: column; gap: 2px; max-width: 80%; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .mhead { display: flex; align-items: baseline; gap: 8px; }
  .mwho { font-family: var(--mono); font-size: 11.5px; font-weight: 700; }
  .mtime { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .bubble { background: var(--surface-2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px 12px 12px 12px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .msg.me .bubble { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 26%, transparent); border-radius: 12px 4px 12px 12px; }
  .sys { align-self: center; font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .composer input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; color: var(--ink); font-family: var(--sans); font-size: 14px; }
  .composer input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .composer button { background: var(--accent); color: #04150F; border: 0; border-radius: 9px; padding: 0 18px; font-family: var(--mono); font-weight: 700; font-size: 13px; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 34vh; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="prompt">~/</span>servd</div>
    <span class="conn"><span class="dot" id="connDot"></span><span id="connText">connecting…</span></span>
    <span class="spacer"></span>
    <div class="namebox">
      <label for="name">you</label>
      <input id="name" maxlength="40" spellcheck="false" autocomplete="off" />
    </div>
  </header>

  <main>
    <aside>
      <div class="panel-head"><span class="panel-title">Devices</span><span class="count" id="count">0</span></div>
      <div class="roster" id="roster"></div>
    </aside>
    <section class="chat">
      <div class="log" id="log"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="text" placeholder="Message the hub…  (encrypted over WSS)" autocomplete="off" />
        <button type="submit" id="send" disabled>send</button>
      </form>
    </section>
  </main>

<script>
  const COLORS = ["#22C3A6","#3B82F6","#E0864B","#A855F7","#EC4899","#EAB308","#10B981","#F43F5E"];
  const $ = id => document.getElementById(id);
  const log = $("log"), roster = $("roster"), count = $("count");
  const connDot = $("connDot"), connText = $("connText"), sendBtn = $("send");
  const nameInput = $("name"), textInput = $("text");

  let name = localStorage.getItem("servd-name") || ("guest-" + Math.floor(1000 + Math.random() * 9000));
  nameInput.value = name;
  let selfId = null, ws = null, retry = null;

  const colorFor = s => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
  const initials = s => s.replace(/[^a-zA-Z0-9]/g, " ").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
  const time = ts => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const scroll = () => { log.scrollTop = log.scrollHeight; };

  function setConn(on, label) {
    connDot.classList.toggle("on", on);
    connText.textContent = label;
    sendBtn.disabled = !on;
  }

  function renderRoster(peers) {
    count.textContent = peers.length;
    roster.innerHTML = "";
    if (!peers.length) {
      roster.innerHTML = '<div class="empty">No devices yet. Open this page on another device on the same network to see it here.</div>';
      return;
    }
    for (const p of peers) {
      const row = document.createElement("div");
      row.className = "peer";
      const you = p.id === selfId ? ' <span class="tag-you">you</span>' : "";
      row.innerHTML =
        '<div class="ava" style="background:' + colorFor(p.name) + '">' + initials(p.name) + '</div>' +
        '<div class="pmeta"><div class="pname">' + esc(p.name) + you + '</div>' +
        '<div class="paddr">' + esc(p.address) + '</div></div>';
      roster.appendChild(row);
    }
  }

  function addChat(fromId, fromName, text, ts) {
    const stick = atBottom();
    const el = document.createElement("div");
    el.className = "msg" + (fromId === selfId ? " me" : "");
    const who = fromId === selfId ? "you" : esc(fromName);
    el.innerHTML =
      '<div class="mhead"><span class="mwho" style="color:' + (fromId === selfId ? "var(--accent-ink)" : colorFor(fromName)) + '">' + who + '</span>' +
      '<span class="mtime">' + time(ts) + '</span></div>' +
      '<div class="bubble">' + esc(text) + '</div>';
    log.appendChild(el);
    if (stick) scroll();
  }

  function addSys(text) {
    const stick = atBottom();
    const el = document.createElement("div");
    el.className = "sys";
    el.textContent = "- " + text + " -";
    log.appendChild(el);
    if (stick) scroll();
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => { setConn(true, "connected"); sayHello(); };
    ws.onclose = () => { setConn(false, "reconnecting…"); scheduleRetry(); };
    ws.onerror = () => ws.close();
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      switch (m.type) {
        case "welcome": selfId = m.selfId; break;
        case "roster": renderRoster(m.peers); break;
        case "chat": addChat(m.fromId, m.fromName, m.text, m.ts); break;
        case "presence": addSys(esc(m.peer.name) + (m.event === "join" ? " joined the hub" : " left the hub")); break;
      }
    };
  }
  function scheduleRetry() { clearTimeout(retry); retry = setTimeout(connect, 1500); }
  function sayHello() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "hello", name })); }

  nameInput.addEventListener("change", () => {
    name = nameInput.value.trim() || name;
    nameInput.value = name;
    localStorage.setItem("servd-name", name);
    sayHello();
  });
  nameInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); nameInput.blur(); } });

  $("composer").addEventListener("submit", e => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: "chat", text }));
    textInput.value = "";
  });

  connect();
</script>
</body>
</html>
