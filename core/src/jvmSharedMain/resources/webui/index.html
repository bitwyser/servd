<style>
  /* ---------- tokens: light (bare :root) ---------- */
  :root {
    --bg: #E9EEEF; --surface: #FFFFFF; --surface-2: #F1F5F6; --border: #D7DFE1; --border-strong: #C2CDD0;
    --ink: #0F1A1F; --muted: #566A70; --faint: #849499;
    --accent: #0E9E88; --accent-ink: #0A7563; --accent-soft: #D6EFEA;
    --idle: #93A2A7; --error: #D14A43; --warn: #B9770E;
    --shadow: 0 1px 2px rgba(15,26,31,.06), 0 8px 24px rgba(15,26,31,.06);
    --shadow-sm: 0 1px 2px rgba(15,26,31,.07);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --r: 10px; --r-sm: 7px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1316; --surface: #141D21; --surface-2: #1A252A; --border: #253136; --border-strong: #35474E;
      --ink: #E6EDEF; --muted: #90A3AA; --faint: #647A81;
      --accent: #22C3A6; --accent-ink: #7BEBD8; --accent-soft: #113029;
      --idle: #5D7178; --error: #EE7169; --warn: #DFA24E;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1316; --surface: #141D21; --surface-2: #1A252A; --border: #253136; --border-strong: #35474E;
    --ink: #E6EDEF; --muted: #90A3AA; --faint: #647A81;
    --accent: #22C3A6; --accent-ink: #7BEBD8; --accent-soft: #113029;
    --idle: #5D7178; --error: #EE7169; --warn: #DFA24E;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; height: 100dvh; overflow: hidden; }
  /* full-viewport app shell: fills the screen, no centering, panels scroll internally */
  .app { height: 100%; display: flex; flex-direction: column; padding: 14px; gap: 14px; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 16px; box-shadow: var(--shadow-sm); }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .brand .prompt { color: var(--accent); }
  .cursor { width: 8px; height: 16px; background: var(--accent); display: inline-block; border-radius: 1px; animation: blink 1.15s steps(1) infinite; transform: translateY(2px); }
  @keyframes blink { 50% { opacity: 0; } }
  .status-pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 100px; padding: 4px 11px; }
  .status-pill.down { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: color-mix(in srgb, var(--warn) 34%, transparent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .dot.live { animation: pulse 2s ease-in-out infinite; }
  .status-pill.down .dot { background: var(--warn); box-shadow: none; animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 8%, transparent); } }
  .uptime { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .spacer { flex: 1 1 auto; }
  .namebox { position: relative; display: inline-flex; align-items: center; width: 130px; }
  .namebox .you-suffix { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 10.5px; color: var(--faint); pointer-events: none; }
  .namebox input { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink); font-family: var(--mono); font-size: 12.5px; border-radius: 8px; padding: 5px 34px 5px 9px; flex: 1; min-width: 0; }
  .namebox input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .host-chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; transition: border-color .15s ease, color .15s ease; }
  .host-chip:hover { border-color: var(--border-strong); }
  .host-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .host-chip.copied { border-color: var(--accent); color: var(--accent-ink); }
  .host-chip .lock { color: var(--accent); display: inline-flex; }
  .chip-warn { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent); border-radius: 100px; padding: 2px 9px; white-space: nowrap; }
  .icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; text-decoration: none; }
  .icon-btn:hover { color: var(--ink); border-color: var(--border-strong); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* uniform header control height */
  .status-pill, .host-chip, .namebox input { height: 32px; }

  /* ---------- grid ---------- */
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 246px minmax(0, 1fr) 400px; gap: 14px; }
  .grid.no-rail { grid-template-columns: 246px minmax(0, 1fr); }
  .grid > * { min-width: 0; min-height: 0; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-sm); }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .panel-title { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  /* uniform badge: count, files badge, presence tag, service state, self-signed chip */
  .count, .badge, .tag-you, .svc-state, .chip-warn { font-family: var(--mono); font-size: 10px; font-weight: 700; line-height: 1.4; padding: 2px 7px; border-radius: 6px; letter-spacing: .03em; }
  .count { color: var(--accent-ink); background: var(--accent-soft); }

  /* ---------- devices ---------- */
  .devices { display: flex; flex-direction: column; }
  #roster { flex: 1; overflow-y: auto; min-height: 0; }
  .dev { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .dev:last-child { border-bottom: 0; }
  .ava { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff; }
  .dev-meta { min-width: 0; flex: 1; }
  .dev-name { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-ip { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .presence { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--accent); }
  .tag-you { color: var(--muted); border: 1px solid var(--border); }
  .dev-empty { padding: 16px 14px; font-family: var(--mono); font-size: 12px; color: var(--faint); line-height: 1.5; }

  /* ---------- center ---------- */
  .center { display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; align-items: center; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--border); }
  .tab-spacer { flex: 1; }
  .mini-btn { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; margin: 0 6px 6px 0; cursor: pointer; }
  .mini-btn:hover { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); }
  .dl.del:hover { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); }
  .tab { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--muted); background: transparent; border: 0; cursor: pointer; padding: 9px 14px; border-radius: 8px 8px 0 0; position: relative; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent-ink); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tab .badge { color: var(--accent-ink); background: var(--accent-soft); margin-left: 6px; }
  .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  /* chat */
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; gap: 2px; max-width: 82%; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg-head { display: flex; align-items: baseline; gap: 8px; }
  .msg-who { font-family: var(--mono); font-size: 11.5px; font-weight: 700; }
  .msg-time { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .bubble { background: var(--surface-2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px 12px 12px 12px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .msg.me .bubble { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 26%, transparent); border-radius: 12px 4px 12px 12px; }
  .sys { align-self: center; font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: center; }
  .file-msg { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .file-msg .fi { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--accent); flex-shrink: 0; }
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .composer textarea { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.4; min-width: 0; resize: none; height: 40px; max-height: 120px; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  /* keep the placeholder on one line, truncated with an ellipsis, instead of wrapping on narrow screens */
  .composer textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Thin, button-less scrollbar for when the message grows past max-height (no native up/down arrows). */
  .composer textarea::-webkit-scrollbar { width: 8px; }
  .composer textarea::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .composer textarea::-webkit-scrollbar-track { background: transparent; }
  /* uniform composer control height: textarea, attach button and send all 40px */
  .composer .icon-btn { width: 40px; height: 40px; }
  .send { width: 40px; height: 40px; flex-shrink: 0; background: var(--accent); color: #04150F; border: 0; border-radius: 10px; padding: 0; cursor: pointer; display: inline-grid; place-items: center; }
  .send:disabled { opacity: .45; cursor: default; }
  .send:hover { filter: brightness(1.05); }
  .send:disabled { opacity: .5; cursor: not-allowed; }

  /* files */
  .files-wrap { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .drop { border: 1.5px dashed var(--border-strong); border-radius: var(--r); padding: 26px; text-align: center; color: var(--muted); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); }
  .drop .big { color: var(--accent); }
  .drop strong { font-family: var(--mono); font-weight: 700; color: var(--ink); }
  .drop small { font-family: var(--mono); color: var(--faint); }
  .flist { display: flex; flex-direction: column; gap: 8px; }
  .frow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); }
  .frow .fi { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--accent); flex-shrink: 0; font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .02em; }
  .frow .fmeta { flex: 1; min-width: 0; }
  .frow .fname { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .fsub { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .frow .fsize { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .frow.uploading { border-style: dashed; }
  .uprog { margin-top: 5px; height: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .upbar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .12s ease; }
  .dl { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); color: var(--muted); background: var(--surface-2); cursor: pointer; text-decoration: none; }
  .dl:hover { color: var(--accent-ink); border-color: var(--accent); }
  .files-empty { font-family: var(--mono); font-size: 12px; color: var(--faint); text-align: center; padding: 10px; }

  /* ---------- right rail ---------- */
  .rail { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; min-height: 0; }
  .rail[hidden] { display: none; } /* class rule would otherwise override the hidden attribute */
  .svc-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .svc-panel #svcList { flex: 1; min-height: 0; overflow-y: auto; }
  .host-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .kv { display: flex; flex-direction: column; gap: 3px; }
  .k { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .k-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .v { font-family: var(--mono); font-size: 13px; color: var(--ink); word-break: break-all; }
  .fingerprint { display: flex; align-items: center; gap: 8px; }
  .fingerprint .v { font-size: 11.5px; color: var(--muted); }
  .qr { width: 140px; height: 140px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .dev-qr { margin-top: auto; padding: 12px 14px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .copy { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); cursor: pointer; flex-shrink: 0; }
  .copy:hover { color: var(--accent-ink); border-color: var(--accent); }
  .svc { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .svc:last-of-type { border-bottom: 0; }
  .svc-ico { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); flex-shrink: 0; }
  .svc.up .svc-ico { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
  .svc-meta { flex: 1; min-width: 0; }
  .svc-name { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
  .svc-name .lock { color: var(--accent); display: inline-flex; }
  .svc-sub { font-family: var(--mono); font-size: 11px; color: var(--faint); word-break: break-word; }
  .svc-state { text-transform: uppercase; }
  .st-up { color: var(--accent-ink); background: var(--accent-soft); }
  .st-down { color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); }
  .switch { position: relative; width: 40px; height: 23px; flex-shrink: 0; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track { position: absolute; inset: 0; border-radius: 20px; background: var(--idle); transition: background .18s; }
  .knob { position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track + .knob { transform: translateX(17px); }
  .switch input:disabled { cursor: default; }
  .switch input:disabled + .track { opacity: .5; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rail-note { font-family: var(--mono); font-size: 11px; color: var(--faint); padding: 10px 14px; display: flex; gap: 7px; align-items: flex-start; line-height: 1.45; }
  .rail-note .lock { color: var(--muted); flex-shrink: 0; margin-top: 1px; }

  .foot { flex: 0 0 auto; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--faint); margin: 0; }

  @media (max-width: 980px) {
    /* stack to one column; the page scrolls instead of each panel being fixed height */
    body { height: auto; overflow: auto; }
    .app { height: auto; min-height: 100dvh; }
    .grid, .grid.no-rail { grid-template-columns: 1fr; }
    .center { min-height: 60vh; }
    .rail { overflow: visible; }
    .svc-panel { flex: none; }
    .svc-panel #svcList { overflow-y: visible; }
  }
  @media (max-width: 700px) {
    .app { padding: 12px; gap: 12px; }
    .topbar { gap: 8px 6px; padding: 10px 12px; }
    .brand { font-size: 15px; }
    .uptime { display: none; }
    /* topbar row 1: brand + status at left, theme + github at right; name and host URL each
       drop to their own full-width row below */
    .brand { order: 1; }
    .status-pill { order: 2; }
    .spacer { order: 3; }
    .topbar .icon-btn { order: 4; }
    .namebox { order: 6; flex: 1 1 100%; width: auto; }
    .namebox input { flex: 1; width: auto; }
    .host-chip { order: 7; flex: 1 1 100%; justify-content: flex-start; }
    /* devices become a compact horizontal strip so chat/files get the vertical space */
    .devices .panel-head { border-bottom: 0; padding-bottom: 4px; }
    #roster { display: flex; flex-direction: row; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 12px 12px; }
    .dev { flex: 0 0 auto; border-bottom: 0; border: 1px solid var(--border); border-radius: 9px; padding: 5px 8px; gap: 7px; }
    .ava { width: 24px; height: 24px; border-radius: 6px; font-size: 10px; }
    .dev-ip { display: none; }
    .dev-name { font-size: 12px; max-width: 96px; }
    .center { min-height: 66vh; }
    .chat-log { padding: 12px; }
  }
  @media (max-width: 420px) {
    .host-chip { font-size: 11px; padding: 6px 8px; }
    .ava { width: 22px; height: 22px; }
    .dev-name { max-width: 84px; }
  }
  @media (prefers-reduced-motion: reduce) { .cursor, .dot.live { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="prompt">~/</span>servd<span class="cursor" aria-hidden="true"></span></div>
      <span class="status-pill" id="statusPill"><span class="dot" id="dot"></span><span id="statusText">connecting...</span></span>
      <span class="uptime" id="uptime"></span>
      <span class="spacer"></span>
      <span class="namebox"><input id="name" maxlength="40" spellcheck="false" autocomplete="off" aria-label="Your display name" /><span class="you-suffix" aria-hidden="true">you</span></span>
      <span class="host-chip" id="hostChip" role="button" tabindex="0" title="Click to copy the share URL"><span class="lock" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span id="hostUrl">-</span></span>
      <button class="icon-btn" id="theme" aria-label="Toggle light / dark theme" title="Toggle light / dark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <a class="icon-btn" href="https://github.com/patkarmandar/servd" target="_blank" rel="noopener noreferrer" aria-label="servd source on GitHub" title="Source on GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </header>

    <div class="grid no-rail" id="grid">
      <!-- devices -->
      <section class="panel devices" aria-label="Connected devices">
        <div class="panel-head"><span class="panel-title">Devices</span><span class="count" id="count">0</span></div>
        <div id="roster"><div class="dev-empty">No devices yet.</div></div>
        <div class="dev-qr">
          <span class="k">Scan to join</span>
          <img class="qr" id="qr" alt="Scan to open the hub on another device" width="140" height="140" />
        </div>
      </section>

      <!-- center: chat / files -->
      <section class="panel center" aria-label="Chat and files">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" aria-selected="true" data-view="files">files<span class="badge" id="fbadge" style="display:none">0</span></button>
          <button class="tab" role="tab" aria-selected="false" data-view="chat">chat</button>
          <span class="tab-spacer"></span>
          <button class="mini-btn" id="clearBtn" type="button">clear files</button>
        </div>

        <div class="view" id="view-chat" role="tabpanel">
          <div class="chat-log" id="log"></div>
          <form class="composer" id="composer" autocomplete="off">
            <button type="button" class="icon-btn" id="attach" aria-label="Share a file">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L10 18.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
            </button>
            <textarea id="text" rows="1" placeholder="Message the hub...  (Enter for new line, Ctrl+Enter to send)" aria-label="Message"></textarea>
            <button class="send" type="submit" id="send" aria-label="Send" title="Send" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </form>
        </div>

        <div class="view active" id="view-files" role="tabpanel">
          <div class="files-wrap">
            <label class="drop" id="drop">
              <input type="file" id="fileInput" multiple hidden />
              <span class="big"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4m0 0-5 5m5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg></span>
              <strong>Drag files here to share</strong>
              <small>or click to browse - sent to every device on the hub</small>
            </label>
            <div class="flist" id="flist"><div class="files-empty">No files shared yet.</div></div>
          </div>
        </div>
      </section>

      <!-- right rail: host + servers (host machine only) -->
      <aside class="rail" id="rail" aria-label="Host and servers" hidden>
        <section class="panel host-card">
          <div class="kv"><span class="k">This host</span><span class="v" id="admHost">-</span></div>
          <div class="kv"><span class="k">Bound interface</span><span class="v" id="admIface">-</span></div>
          <div class="kv">
            <div class="k-row"><span class="k">TLS fingerprint (SHA-256)</span><span class="chip-warn" title="Self-signed certificate - verify this fingerprint">self-signed</span></div>
            <div class="fingerprint"><span class="v" id="admFp">-</span>
              <button class="copy" id="copyfp" aria-label="Copy fingerprint" title="Copy fingerprint">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              </button>
            </div>
          </div>
        </section>
        <section class="panel svc-panel">
          <div class="panel-head"><span class="panel-title">Servers</span></div>
          <div id="svcList"></div>
          <div class="rail-note">
            <span class="lock"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            Server toggles are visible on the host only - this panel is served on 127.0.0.1.
          </div>
        </section>
      </aside>
    </div>

  </div>

<script>
  const COLORS = ["#0E9E88","#3B6FE0","#C0603A","#7A57C2","#C4396F","#B8860B","#0E9E88","#D14A43"];
  const LOCK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const FILEICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/></svg>';
  const DLICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0-4-4m4 4 4-4"/><path d="M5 20h14"/></svg>';
  const XICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const SVCICON = {
    http: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>',
    ssh:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>',
    ftp:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const colorFor = s => COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
  const initials = s => String(s).replace(/[^a-zA-Z0-9]/g," ").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase() || "?";
  const time = ts => new Date(ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  const ext = n => { const p = String(n).lastIndexOf("."); return p>0 ? n.slice(p+1,p+5).toUpperCase() : "FILE"; };
  function fmtSize(b){ if(b<1024) return b+" B"; const u=["KB","MB","GB"]; let i=-1; do{ b/=1024; i++; }while(b>=1024&&i<u.length-1); return b.toFixed(b<10?1:0)+" "+u[i]; }
  function fmtUptime(ms){ const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return h>0 ? `up ${h}h ${m}m` : `up ${m}m`; }

  const log=$("log"), roster=$("roster"), count=$("count"), flist=$("flist"), fbadge=$("fbadge");
  const textInput=$("text"), sendBtn=$("send"), nameInput=$("name"), fileInput=$("fileInput"), drop=$("drop");
  const dot=$("dot"), statusPill=$("statusPill"), statusText=$("statusText");

  // NB: named userName, not name, to avoid colliding with the global window.name (always a string).
  let userName = localStorage.getItem("servd-name") || ("guest-" + Math.floor(1000 + Math.random()*9000));
  nameInput.value = userName;
  function setTitle(){ document.title = (userName ? userName + " · " : "") + "servd"; }
  setTitle();
  let selfId=null, ws=null, retry=null, lastConnected=0;
  const files = new Map();
  const uploads = new Map(); let upSeq = 0; // in-flight uploads: id -> {name,size,loaded,xhr}

  // theme
  (function(){ const t=localStorage.getItem("servd-theme"); if(t) document.documentElement.setAttribute("data-theme",t); })();
  $("theme").addEventListener("click", () => {
    const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.getAttribute("data-theme") || (isDark ? "dark":"light");
    const next = cur==="dark" ? "light":"dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("servd-theme", next);
  });

  function setConn(on){
    dot.classList.toggle("live", on);
    statusPill.classList.toggle("down", !on);
    statusText.textContent = on ? "daemon running" : "reconnecting...";
    sendBtn.disabled = !on;
  }

  // ---- status / host card ----
  // Keep the name box the same width as the share-URL chip (desktop only; on small screens both
  // are full-width rows). Runs after the chip's address text is set, so its width is up to date.
  function syncNameWidth(){
    const nb=document.querySelector('.namebox'), chip=$("hostChip");
    if(!nb||!chip) return;
    if(window.innerWidth>700 && $("hostUrl").textContent.trim()!=="-") nb.style.width=chip.offsetWidth+"px";
    else if(window.innerWidth<=700) nb.style.width="";
  }
  window.addEventListener("resize", syncNameWidth);

  function loadStatus(){
    fetch("/status").then(r=>r.json()).then(s => {
      $("hostUrl").textContent = location.protocol + "//" + s.address + ":" + s.port;
      syncNameWidth();
      $("uptime").textContent = fmtUptime(s.uptimeMs);
      lastConnected = s.connected;
      if (!$("rail").hidden) {
        $("admHost").textContent = s.hostName || s.address;
        $("admIface").textContent = (s.interfaceName ? s.interfaceName + " · " : "") + s.address;
        $("admFp").textContent = s.fingerprintSha256;
      }
    }).catch(()=>{});
  }

  // ---- roster ----
  function renderRoster(peers){
    count.textContent = peers.length;
    if (!peers.length){ roster.innerHTML = '<div class="dev-empty">No devices yet. Open this page on another device on the same network.</div>'; return; }
    roster.innerHTML = "";
    for (const p of peers){
      const you = p.id===selfId ? ' <span class="tag-you">you</span>' : "";
      const row = document.createElement("div"); row.className="dev";
      row.innerHTML =
        '<div class="ava" style="background:'+colorFor(p.name)+'">'+initials(p.name)+'</div>'+
        '<div class="dev-meta"><div class="dev-name">'+esc(p.name)+you+'</div><div class="dev-ip">'+esc(p.address)+'</div></div>'+
        '<span class="presence"></span>';
      roster.appendChild(row);
    }
  }

  // ---- chat ----
  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  function addChat(fromId, fromName, text, ts){
    const stick=atBottom(); const el=document.createElement("div"); el.className="msg"+(fromId===selfId?" me":"");
    const who = fromId===selfId ? "you" : esc(fromName);
    const col = fromId===selfId ? "var(--accent-ink)" : colorFor(fromName);
    el.innerHTML = '<div class="msg-head"><span class="msg-who" style="color:'+col+'">'+who+'</span><span class="msg-time">'+time(ts)+'</span></div><div class="bubble">'+esc(text)+'</div>';
    log.appendChild(el); if(stick) log.scrollTop=log.scrollHeight;
  }
  function addSys(t){ const stick=atBottom(); const el=document.createElement("div"); el.className="sys"; el.textContent="- "+t+" -"; log.appendChild(el); if(stick) log.scrollTop=log.scrollHeight; }
  function addFileMsg(f){
    const stick=atBottom(); const mine=f.fromName===userName;
    const el=document.createElement("div"); el.className="msg"+(mine?" me":"");
    const who = mine ? "you" : esc(f.fromName);
    const col = mine ? "var(--accent-ink)" : colorFor(f.fromName);
    el.innerHTML = '<div class="msg-head"><span class="msg-who" style="color:'+col+'">'+who+'</span><span class="msg-time">'+time(f.ts)+'</span></div>'+
      '<a class="bubble file-msg" href="/files/'+encodeURIComponent(f.id)+'" download="'+esc(f.name)+'"><span class="fi">'+FILEICON+'</span>shared <b>'+esc(f.name)+'</b> &middot; '+fmtSize(f.size)+'</a>';
    log.appendChild(el); if(stick) log.scrollTop=log.scrollHeight;
  }

  // ---- files ----
  function renderFiles(){
    const items=[...files.values()].sort((a,b)=>b.ts-a.ts);
    const ups=[...uploads.entries()];
    fbadge.style.display = items.length ? "" : "none"; fbadge.textContent=items.length;
    if(!items.length && !ups.length){ flist.innerHTML='<div class="files-empty">No files shared yet.</div>'; return; }
    flist.innerHTML="";
    for(const [id,u] of ups){
      const pct=u.size?Math.min(100,Math.round(u.loaded/u.size*100)):0;
      const row=document.createElement("div"); row.className="frow uploading"; row.dataset.up=id;
      row.innerHTML='<span class="fi">'+esc(ext(u.name))+'</span>'+
        '<div class="fmeta"><div class="fname">'+esc(u.name)+'</div><div class="fsub upsub">uploading&hellip; '+pct+'%</div><div class="uprog"><div class="upbar" style="width:'+pct+'%"></div></div></div>'+
        '<span class="fsize upsize">'+fmtSize(u.loaded)+' / '+fmtSize(u.size)+'</span>'+
        '<button class="dl del" data-cancel="'+id+'" title="Cancel upload">'+XICON+'</button>';
      flist.appendChild(row);
    }
    for(const f of items){
      const row=document.createElement("div"); row.className="frow";
      row.innerHTML='<span class="fi">'+esc(ext(f.name))+'</span>'+
        '<div class="fmeta"><div class="fname">'+esc(f.name)+'</div><div class="fsub">from '+esc(f.fromName)+' &middot; '+time(f.ts)+'</div></div>'+
        '<span class="fsize">'+fmtSize(f.size)+'</span>'+
        '<a class="dl" href="/files/'+encodeURIComponent(f.id)+'" download="'+esc(f.name)+'" title="Download">'+DLICON+'</a>'+
        '<button class="dl del" data-del="'+esc(f.id)+'" title="Delete">'+XICON+'</button>';
      flist.appendChild(row);
    }
    flist.querySelectorAll('button[data-del]').forEach(b=>b.addEventListener('click',()=>{
      if(confirm('Delete this file for everyone?')) fetch('/files/'+encodeURIComponent(b.dataset.del),{method:'DELETE'}).catch(()=>{});
    }));
    flist.querySelectorAll('button[data-cancel]').forEach(b=>b.addEventListener('click',()=>{ const u=uploads.get(b.dataset.cancel); if(u&&u.xhr) u.xhr.abort(); }));
  }
  function updateUpRow(id){
    const u=uploads.get(id); if(!u) return;
    const row=flist.querySelector('[data-up="'+id+'"]'); if(!row) return;
    const pct=u.size?Math.min(100,Math.round(u.loaded/u.size*100)):0;
    const bar=row.querySelector('.upbar'); if(bar) bar.style.width=pct+'%';
    const sub=row.querySelector('.upsub'); if(sub) sub.textContent='uploading… '+pct+'%';
    const sz=row.querySelector('.upsize'); if(sz) sz.textContent=fmtSize(u.loaded)+' / '+fmtSize(u.size);
  }
  function addFile(f, announce){ const isNew=!files.has(f.id); files.set(f.id,f); renderFiles(); if(isNew&&announce) addFileMsg(f); }
  function loadFiles(){ fetch("/files").then(r=>r.json()).then(list=>{ list.forEach(f=>files.set(f.id,f)); renderFiles(); }).catch(()=>{}); }
  function upload(fileList){
    for(const file of fileList){
      const id="up-"+(upSeq++);
      const xhr=new XMLHttpRequest();
      uploads.set(id,{name:file.name,size:file.size,loaded:0,xhr});
      renderFiles();
      xhr.upload.addEventListener("progress",e=>{ const u=uploads.get(id); if(u){ u.loaded=e.loaded; updateUpRow(id); } });
      xhr.addEventListener("load",()=>{
        if(!(xhr.status>=200&&xhr.status<300)) addSys("upload failed: "+file.name);
        uploads.delete(id); renderFiles(); // the shared file itself arrives via the /ws announce
      });
      xhr.addEventListener("error",()=>{ addSys("upload failed: "+file.name); uploads.delete(id); renderFiles(); });
      xhr.addEventListener("abort",()=>{ uploads.delete(id); renderFiles(); });
      const fd=new FormData(); fd.append("from",userName); fd.append("file",file,file.name);
      xhr.open("POST","/files"); xhr.send(fd);
    }
  }

  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",ev=>{ if(ev.dataTransfer&&ev.dataTransfer.files.length) upload(ev.dataTransfer.files); });
  fileInput.addEventListener("change",()=>{ if(fileInput.files.length){ upload(fileInput.files); fileInput.value=""; } });
  $("attach").addEventListener("click",()=>fileInput.click());

  // ---- admin (host only) ----
  function svcSub(s){
    if (s.id==="http") return ":"+s.port+" · dashboard, files, chat" + (lastConnected?(" · "+lastConnected+" connected"):"");
    return ":"+s.port + (s.detail ? " · "+s.detail : "");
  }
  function renderServices(list){
    const el=$("svcList"); el.innerHTML="";
    for(const s of list){
      const up = s.state==="Running";
      const row=document.createElement("div"); row.className="svc"+(up?" up":"");
      row.innerHTML =
        '<span class="svc-ico">'+(SVCICON[s.id]||SVCICON.http)+'</span>'+
        '<div class="svc-meta"><div class="svc-name">'+esc(s.id)+' <span class="lock" title="encrypted">'+LOCK+'</span></div>'+
        '<div class="svc-sub">'+esc(svcSub(s))+'</div></div>'+
        '<span class="svc-state '+(up?"st-up":"st-down")+'">'+(up?"up":"down")+'</span>'+
        '<label class="switch"><input type="checkbox"'+(up?" checked":"")+(s.toggleable?"":" disabled")+' data-id="'+esc(s.id)+'"><span class="track"></span><span class="knob"></span></label>';
      el.appendChild(row);
    }
    el.querySelectorAll("input[data-id]").forEach(cb=>cb.addEventListener("change",()=>{
      const action=cb.checked?"start":"stop";
      cb.disabled=true;
      fetch("/admin/services/"+encodeURIComponent(cb.dataset.id)+"/"+action,{method:"POST"}).then(r=>r.json()).then(l=>{renderServices(l);loadStatus();}).catch(checkAdmin);
    }));
  }
  function checkAdmin(){
    fetch("/admin/services").then(r=>{ if(!r.ok) throw 0; return r.json(); })
      .then(list=>{ $("rail").hidden=false; $("grid").classList.remove("no-rail"); renderServices(list); loadStatus(); })
      .catch(()=>{ $("rail").hidden=true; $("grid").classList.add("no-rail"); });
  }

  // ---- tabs ----
  document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected","false"));
    tab.setAttribute("aria-selected","true");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    $("view-"+tab.dataset.view).classList.add("active");
    updateClearBtn();
  }));
  function activeView(){ return document.querySelector('.tab[aria-selected="true"]').dataset.view; }
  function updateClearBtn(){ $("clearBtn").textContent = activeView()==="files" ? "clear files" : "clear chat"; }
  updateClearBtn(); // reflect the default tab (files) on load
  $("clearBtn").addEventListener("click",()=>{
    if(activeView()==="files"){
      if(confirm("Delete all shared files for everyone?")) fetch("/files?from="+encodeURIComponent(userName),{method:"DELETE"}).catch(()=>{});
    } else {
      if(confirm("Clear the chat for everyone?") && ws && ws.readyState===1) ws.send(JSON.stringify({type:"clearChat"}));
    }
  });

  // ---- copy fingerprint ----
  $("copyfp").addEventListener("click",()=>{ if(navigator.clipboard) navigator.clipboard.writeText($("admFp").textContent); });

  // ---- copy share URL (click the host chip) ----
  (function(){
    const chip=$("hostChip"); if(!chip) return;
    function copyShare(){
      const host=$("hostUrl").textContent.trim(); // already includes the https:// scheme
      if(!host || host==="-" || !navigator.clipboard) return;
      navigator.clipboard.writeText(host+"/").then(()=>{
        chip.classList.add("copied"); setTimeout(()=>chip.classList.remove("copied"),1200);
      }).catch(()=>{});
    }
    chip.addEventListener("click",copyShare);
    chip.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); copyShare(); } });
  })();

  // ---- name ----
  nameInput.addEventListener("change",()=>{ userName=nameInput.value.trim()||userName; nameInput.value=userName; localStorage.setItem("servd-name",userName); setTitle(); sayHello(); });
  nameInput.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); nameInput.blur(); } });

  // ---- composer ----
  function autoGrow(){
    textInput.style.height="auto";
    const cs=getComputedStyle(textInput);
    const border=parseFloat(cs.borderTopWidth)+parseFloat(cs.borderBottomWidth);
    // empty: stay one line so a long placeholder never grows the box; otherwise size to content
    const full=textInput.value ? textInput.scrollHeight+border : 40; // border-box: add borders so text isn't clipped
    textInput.style.height=Math.max(40,Math.min(full,120))+"px"; // never below one line (40px), never above 120
    textInput.style.overflowY = full>120 ? "auto" : "hidden";
  }
  function sendMsg(){ const t=textInput.value.replace(/\s+$/,""); if(!t||!ws||ws.readyState!==1) return; ws.send(JSON.stringify({type:"chat",text:t})); textInput.value=""; autoGrow(); }
  $("composer").addEventListener("submit",e=>{ e.preventDefault(); sendMsg(); });
  // Enter inserts a newline (textarea default); Ctrl/Cmd+Enter sends.
  textInput.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); sendMsg(); } });
  textInput.addEventListener("input",autoGrow);
  autoGrow(); // set the initial height/overflow so a single line never shows a scrollbar

  // ---- websocket ----
  function connect(){
    ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
    ws.onopen=()=>{ setConn(true); sayHello(); loadStatus(); };
    ws.onclose=()=>{ setConn(false); clearTimeout(retry); retry=setTimeout(connect,1500); };
    ws.onerror=()=>ws.close();
    ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch{ return; }
      switch(m.type){
        case "welcome": selfId=m.selfId; break;
        case "roster": renderRoster(m.peers); break;
        case "chat": addChat(m.fromId,m.fromName,m.text,m.ts); break;
        case "presence": addSys(esc(m.peer.name)+(m.event==="join"?" joined the hub":" left the hub")); loadStatus(); break;
        case "file": addFile(m.file,true); break;
        case "chatCleared": log.innerHTML=""; addSys("chat cleared by "+esc(m.byName)); break;
        case "fileRemoved": files.delete(m.id); renderFiles(); break;
        case "filesCleared": files.clear(); renderFiles(); addSys("files cleared by "+esc(m.byName)); break;
      }
    };
  }
  function sayHello(){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"hello",name:userName})); }

  $("qr").src = "/qr"; // scan-to-join QR of the shareable hub URL (shown for everyone)
  loadFiles();
  checkAdmin();
  connect();
  setInterval(loadStatus, 15000); // keep uptime / connected count fresh
</script>
</body>
</html>
