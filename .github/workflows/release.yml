name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must equal v<servdVersion> from gradle.properties (checked below). Each artifact is built
# on its native OS (jpackage is per-OS), then all are attached to a GitHub Release for the tag.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write   # needed to create the release

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Verify tag matches servdVersion
        run: |
          version=$(grep -E '^[[:space:]]*servdVersion[[:space:]]*=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          tag="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match servdVersion=$version in gradle.properties"; exit 1
          fi
          kver=$(grep -E 'const val VERSION' core/src/commonMain/kotlin/dev/servd/core/Servd.kt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$kver" != "$version" ]; then
            echo "::error::Servd.VERSION=$kver does not match servdVersion=$version"; exit 1
          fi

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Windows zip
        shell: pwsh
        run: .\package.ps1 -Desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/servd-*-windows.zip
          if-no-files-found: error

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install appimagetool
        run: |
          sudo wget -qO /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'   # run appimagetool without FUSE (CI has no FUSE)
        run: ./package.sh --desktop --appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Write signing config from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Android signing secrets are not set (see README > Releases)"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > androidApp/servd-release.jks
          cat > androidApp/keystore.properties <<EOF
          storeFile=androidApp/servd-release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed release APK
        run: ./package.sh --android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/servd-*-release.apk
          if-no-files-found: error

  release:
    needs: [ check-version, windows, linux, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: servd ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/windows/*.zip
            artifacts/linux/*.AppImage
            artifacts/android/*.apk
